name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MND_RETRIEVAL_MODE: lexical
      MND_BACKEND: api
      MND_AGENT_MODEL: test-model
      MND_REQUIRE_PARTICIPANT_LOGIN: "0"
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: >-
          python -m pip install requests fastapi uvicorn
          "pydantic>=2,<3" "langgraph>=1.2,<2" "gradio>=6,<7"
          "openai>=2.54,<3" "anthropic>=0.125,<1" pytest httpx
      - name: Validate Python syntax
        run: python -m compileall -q .
      - name: Run tests without inference downloads
        run: python -m pytest -q tests
      - name: Validate shell launcher
        run: bash -n start_app.sh
